# Uploads the package to PyPI when a GitHub release is published.
# The version comes from the release tag via setuptools_scm (tag v0.1.0 ->
# version 0.1.0), so nothing in the repository needs bumping.
#
# Publishing uses PyPI trusted publishing: register this repository and
# this workflow file (python-publish.yml) as a trusted publisher on PyPI.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        # setuptools_scm needs the tag history to compute the version
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build package
      run: python -m build
    - name: Check package
      run: python -m twine check --strict dist/*
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
